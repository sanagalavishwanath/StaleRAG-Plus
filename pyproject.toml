[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stalerag"
version = "0.1.0"
description = "Temporal evidence reliability and stale information detection for RAG"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "requests>=2.31",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
stalerag = "stalerag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
