data:
  source: jsonl
  path: data/stalerag_benchmark.jsonl
split: [0.5, 0.2, 0.3]
data_seed: 13
seeds: [0, 1, 2, 3, 4]
n_boot: 1000
coverage: 0.8
filter_threshold: 0.5
nli:
  kind: hf
  model_id: microsoft/deberta-large-mnli
detector:
  backend: lightgbm
readers:
  - {kind: hf, name: llama-3.1-8b, model_id: meta-llama/Llama-3.1-8B-Instruct}
  - {kind: hf, name: qwen2.5-7b, model_id: Qwen/Qwen2.5-7B-Instruct}
  - {kind: hf, name: mistral-7b, model_id: mistralai/Mistral-7B-Instruct-v0.3}
